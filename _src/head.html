<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pagetitle}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Noteic">
<meta property="og:title" content="{{pagetitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://noteic.github.io/assets/img/two-windows.jpg">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090b11" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="{{root}}assets/img/noteic-32.png">
<link rel="apple-touch-icon" href="{{root}}assets/img/noteic-180.png">
<link rel="stylesheet" href="{{root}}assets/site.css?v={{version}}">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("noteic-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="{{root}}assets/site.js?v={{version}}" defer></script>
